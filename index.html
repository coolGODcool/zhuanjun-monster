<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>政戰小怪獸｜專軍背誦</title>
<style>
:root{
  --bg:#f6f1e7;--card:#fffdf8;--ink:#2b2a26;--sub:#7a7468;--line:#e7dfcf;
  --g:#4f7d4a;--g2:#e5efdc;--o:#e8833a;--o2:#fbe6d4;--r:#c9483b;--r2:#f7dcd8;--b:#3f6b8f;--b2:#dde9f2;--y:#e9b93a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px}
body{padding-bottom:76px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:4px 0 10px}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.btn{display:block;width:100%;padding:13px 14px;border-radius:14px;font-weight:700;font-size:16px;text-align:center}
.btn.pri{background:var(--g);color:#fff}
.btn.sec{background:var(--g2);color:var(--g)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn:active{transform:scale(.98)}
.chip{display:inline-block;padding:5px 11px;border-radius:99px;background:#efe8da;font-size:13px;margin:0 6px 6px 0}
.chip.on{background:var(--g);color:#fff}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;max-width:110px;padding:9px 0 10px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:21px;line-height:1}
nav button.on{color:var(--g);font-weight:700}
/* pet */
.pet{position:relative;text-align:center;padding:6px 0 0}
.pet svg{width:190px;height:190px;animation:bob 2.6s ease-in-out infinite}
.pet.happy svg{animation:hop 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) scale(1.03,.97)}}
.blink{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bubble{display:inline-block;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:7px 12px;font-size:14px;margin-top:2px;max-width:90%}
.petname{font-size:20px;font-weight:800;margin-top:6px}
.bar{height:12px;border-radius:99px;background:#ece4d3;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--o));border-radius:99px;transition:width .5s}
.bar.g i{background:linear-gradient(90deg,#8cc07f,var(--g))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:#f4eee2;border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--sub)}
.mission{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.mission:last-child{border:0}
.mission .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;flex:none}
.mission.done .ck{background:var(--g);border-color:var(--g);color:#fff}
.mission.done span{color:var(--sub);text-decoration:line-through}
/* study */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .bar{flex:1}
.x{font-size:22px;padding:4px 8px}
.tag{font-size:12px;color:var(--sub)}
.q{font-size:19px;font-weight:700;line-height:1.55;margin:6px 0 2px}
.ans{white-space:pre-wrap;line-height:1.8;font-size:17px;background:#f7f2e7;border-radius:12px;padding:12px;margin-top:10px}
.hint{background:var(--o2);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.65;margin-top:10px}
.hint b{color:var(--o)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grade button{padding:12px 4px;border-radius:14px;font-weight:700;font-size:15px}
.gb{background:var(--r2);color:var(--r)}.gm{background:#f8eccb;color:#9a6c08}.gg{background:var(--g2);color:var(--g)}
.modebadge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--b2);color:var(--b);font-weight:700}
.slots{min-height:64px;background:#f7f2e7;border-radius:12px;padding:10px;line-height:2.1;font-size:17px;margin-top:10px;white-space:pre-wrap}
.slots .ok{color:var(--g)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tile{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;font-size:16px;box-shadow:0 2px 0 var(--line)}
.tile.used{visibility:hidden}
.tile.bad{animation:shake .35s;border-color:var(--r);background:var(--r2)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
textarea{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:17px;line-height:1.7;background:#fff;resize:vertical}
.diff{white-space:pre-wrap;line-height:1.9;font-size:17px;background:#f7f2e7;border-radius:12px;padding:12px;margin-top:10px}
.diff .miss{background:var(--r2);color:var(--r);text-decoration:underline;font-weight:700}
.diff .extra{color:var(--r);text-decoration:line-through;opacity:.75}
.score{font-size:28px;font-weight:800;text-align:center;margin-top:8px}
.xpfloat{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-size:28px;font-weight:900;color:var(--o);pointer-events:none;animation:up 1s forwards;z-index:50}
@keyframes up{to{transform:translate(-50%,-80px);opacity:0}}
/* list */
.search{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);font:inherit;background:#fff;margin-bottom:10px}
.qi{border-bottom:1px solid var(--line);padding:11px 2px}
.qi:last-child{border:0}
.qi .qq{display:flex;gap:8px;font-size:15px;line-height:1.5}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px;background:#ddd}
.qi .aa{white-space:pre-wrap;font-size:15px;line-height:1.75;margin:8px 0 0 18px;color:#403c33}
.skill{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.skill:last-child{border:0}
.skill .ic{font-size:26px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#eee6d6;filter:grayscale(1);opacity:.5;flex:none}
.skill.on .ic{filter:none;opacity:1;background:var(--o2)}
.skill .bd{flex:1}
.week{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--sub)}
.week i{display:block;background:var(--g);border-radius:6px 6px 0 0;margin-bottom:4px;min-height:2px}
.modal{position:fixed;inset:0;background:rgba(40,35,25,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.on{display:flex}
.modal .card{max-width:420px;width:100%;text-align:center}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:70;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
label.set{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
select,input[type=text]{font:inherit;padding:6px 8px;border-radius:9px;border:1.5px solid var(--line);background:#fff}
.hide{display:none!important}
.small{font-size:13px}
.edtag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:#dde9f2;color:#3f6b8f;font-weight:700;margin-left:6px}
.editlink{display:block;text-align:center;font-size:13px;color:var(--b);text-decoration:underline;margin:6px 0 12px}
.modal .card.left{text-align:left}
.modal textarea{min-height:90px;font-size:15px}
.code{font-size:40px;font-weight:900;letter-spacing:8px;text-align:center;color:var(--o)}
.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.pl:last-child{border:0}
.pl .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;flex:none;border:2px solid #2b2a26}
.pl .nm{flex:1;font-size:15px}
.pl .sc{font-weight:900;font-size:17px}
.pl .pb{height:6px;border-radius:9px;background:#ece4d3;margin-top:4px;overflow:hidden}
.pl .pb i{display:block;height:100%;background:var(--o)}
.big{font-size:64px;text-align:center;font-weight:900;color:var(--o)}
input.codein{font-size:28px;letter-spacing:6px;text-align:center;width:100%;padding:10px;border-radius:12px;border:2px solid var(--line)}

.dg{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.dg h4{margin:0 0 10px;font-size:14px;color:var(--b)}
.fl{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.fl.h{flex-direction:row;flex-wrap:wrap;align-items:center}
.fl .nd{background:var(--b2);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.4;text-align:center}
.fl.h .nd{flex:1;min-width:64px;padding:8px 6px}
.fl .nd small{display:block;color:var(--sub);font-size:12px}
.fl .ar{text-align:center;color:var(--sub);font-size:14px}
.py{display:flex;flex-direction:column;align-items:center;gap:4px}
.py div{background:linear-gradient(#f3d27a,#e9b93a);border-radius:8px;padding:7px 6px;text-align:center;font-size:14px;font-weight:700}
.py small{display:block;font-weight:400;font-size:12px;color:#5b4a1a}
.tr .rt{background:var(--g);color:#fff;border-radius:10px;padding:8px;text-align:center;font-weight:700;font-size:14px}
.tr .kd{border-left:3px solid var(--g2);margin:6px 0 0 14px;padding-left:10px}
.tr .kd b{display:block;font-size:14px;margin-top:6px}
.tr .kd span{display:inline-block;background:var(--g2);color:var(--g);border-radius:8px;padding:3px 8px;font-size:13px;margin:4px 4px 0 0}
.gd{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.gd div{background:var(--b2);border-radius:12px;padding:8px;text-align:center;font-size:14px}
.gd div i{display:block;font-style:normal;font-size:24px}
.gd small{display:block;color:var(--b);font-weight:700}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{background:var(--b2);color:var(--b);text-align:left;padding:6px}
table.tb td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top;line-height:1.5}
.sc div{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:4px}
.sc i{width:64px;flex:none;color:#fff;font-style:normal;font-weight:700;text-align:center;border-radius:8px;padding:6px 0}
.pal{background:#efe6f7;border-radius:14px;padding:12px;margin-top:10px}
.pal h4{margin:0 0 8px;font-size:14px;color:#6b4c8f}
.stop{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.55;margin-bottom:7px}
.stop i{font-style:normal;width:30px;height:30px;flex:none;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:16px}
.route{font-size:12px;color:#6b4c8f;line-height:1.8}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.panel{flex:0 0 86%;scroll-snap-align:center;background:#fff;border:3px solid #2b2a26;border-radius:6px;overflow:hidden;box-shadow:3px 3px 0 #2b2a26}
.panel svg{display:block;width:100%;height:auto}
.panel .cap{border-top:3px solid #2b2a26;padding:8px 10px;font-size:14px;line-height:1.5;background:#fffbe9}
.panel .cap b{color:#c9483b}
.panel .qbar{background:#2b2a26;color:#fff;font-size:12.5px;line-height:1.45;padding:6px 10px}
.cover{display:flex;flex-direction:column;justify-content:center;background:#e8833a;color:#fff;padding:16px;min-height:300px}
.cover .t{font-size:13px;opacity:.9}
.cover .qq{font-size:20px;font-weight:900;line-height:1.5;margin:10px 0;text-shadow:2px 2px 0 #2b2a26}
.cover .n{font-size:13px;background:#2b2a26;border-radius:99px;padding:4px 10px;align-self:flex-start}

.sim{background:#fff4e0;border:2px solid #f0c27a;border-radius:14px;padding:12px;margin-top:10px}
.sim h4{margin:0 0 6px;font-size:14px;color:#a8630c}
.sim .nt{font-size:14px;line-height:1.7;background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.sim .it{border-top:1px dashed #f0c27a;padding:8px 0;font-size:14px;line-height:1.6}
.sim .it.me{background:#fffaf0}
.sim .it .sq{font-weight:700}
.sim .it .aa{white-space:pre-wrap;color:#403c33;margin-top:3px}
.sim mark{background:#ffd98a;border-radius:4px;padding:0 2px}
.simtag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:#ffd98a;color:#7a4a05;font-weight:700;margin-left:6px}

.swipe{font-size:12px;color:#6b4c8f;text-align:center}
.pal .tg{font-size:12px;color:#6b4c8f;text-decoration:underline;margin-left:6px}


</style>
</head>

const FIREBASE_CONFIG = {apiKey:"AIzaSyAxRlxXWCj9KX5pjmzG6nfeFxI9FMqqBQ0",authDomain:"zhuanjun-monster.firebaseapp.com",databaseURL:"https://zhuanjun-monster-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"zhuanjun-monster",storageBucket:"zhuanjun-monster.firebasestorage.app",messagingSenderId:"903573317461",appId:"1:903573317461:web:82fa67166d55019ed771dc"};
/* ==================================== */
window.__fbReady=new Promise(r=>{window.__fbResolve=r;setTimeout(()=>r(null),12000)});
window.claude={use:(n)=>window.__fbReady.then(fb=>fb?(fb[n]||null):null)};

<script type="module">
const cfg=FIREBASE_CONFIG;
if(!cfg||!cfg.apiKey||cfg.apiKey==='PASTE_HERE'||!cfg.databaseURL){window.__fbResolve(null)}else{
try{
const A=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
const R=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
const app=A.initializeApp(cfg);const D=R.getDatabase(app);
let PID=null;try{PID=localStorage.getItem('zj-pid')}catch(e){}
if(!PID){PID='p'+Math.random().toString(36).slice(2,10);try{localStorage.setItem('zj-pid',PID)}catch(e){}}
const TAB=PID+'-'+Math.random().toString(36).slice(2,6);
const db={collection:(p)=>{
  if(p==='edits')return{
    onSnapshot:(f,err)=>R.onValue(R.ref(D,'edits'),s=>{const v=s.val()||{};f({docs:Object.entries(v).map(([id,d])=>({id,exists:true,data:()=>d}))})},err),
    doc:(id)=>({set:(d)=>R.set(R.ref(D,'edits/'+id),d),delete:()=>R.remove(R.ref(D,'edits/'+id))})};
  return{onSnapshot:()=>()=>{},doc:()=>({get:async()=>({exists:false,data:()=>undefined}),set:async()=>{}})};
}};
const user={id:async()=>PID,profiles:async()=>({}),me:async()=>({name:''})};
const room={join:async(name)=>{
  const base='rooms/'+name+'/players',myRef=R.ref(D,base+'/'+TAB);let mine={},cache={};const fns=[];
  R.onDisconnect(myRef).remove();
  const unsub=R.onValue(R.ref(D,base),s=>{cache=s.val()||{};fns.forEach(f=>{try{f({})}catch(e){}})});
  return{name,
    presence:async(p)=>{for(const k in p){if(p[k]===null)delete mine[k];else mine[k]=p[k]}await R.set(myRef,mine)},
    peers:()=>Object.entries(cache).map(([k,v])=>({peer:k,by:k,isMe:k===TAB,sameTab:k===TAB,kind:'viewer',guest:false,presence:v||{},updatedAt:0})),
    onPeers:(f)=>{fns.push(f);setTimeout(()=>f({}),0);return()=>{}},
    leave:async()=>{unsub();await R.remove(myRef)},connected:()=>true};
}};
window.__fbResolve({db,user,room});
}catch(e){console.error(e);window.__fbResolve(null)}}
</script>

  <button data-t="home" class="on"><b>🏠</b>小怪獸</button>

<script>
const DATA = [{"id": "e1-0", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第一題", "q": "中共傳統以來對臺統戰政策內容內涵與特色主要為何？", "a": "1、底線清晰、彈性務實。\n2、軟硬兼施、分而治之。\n3、採取「五化」策略。"}, {"id": "e1-1", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第二題", "q": "中共對臺政策中「採取五化策略」內容為何？", "a": "孤立化、邊緣化、碎裂化、空洞化、區域化。"}, {"id": "e1-2", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第三題", "q": "中共參照馬克思主義的理論指導：無產階級政黨在一定歷史條件下，為了反對主要敵人，同其他革命階級、革命政黨和團體，以及一切可能團結的力量結成的聯盟，進行何種名詞定義？", "a": "統一戰線。"}, {"id": "e1-3", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第四題", "q": "中共統戰常用的方法為何？", "a": "聯合次要敵人，打擊主要敵人。"}, {"id": "e1-4", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第五題", "q": "中共統戰策略的基本原則有哪些？", "a": "1、利用敵人內部矛盾的原則。\n2、既聯合又鬥爭的原則。\n3、獨立自主的原則。\n4、爭取領導權的原則。"}, {"id": "e1-5", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第六題", "q": "中共統戰策略的基本作法有哪些？", "a": "1、滲透與偽裝。\n2、宣傳與鼓動。\n3、分化與聯合。\n4、威脅與利誘。"}, {"id": "e1-6", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第七題", "q": "中共統戰策略之本質為何？", "a": "1、欺騙性。\n2、鬥爭性。\n3、極權性。\n4、特殊性。"}, {"id": "e1-7", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第八題", "q": "當前中共的對臺政策，在一個中國原則下，以哪兩種（和戰）手段進行做為其策略？", "a": "1、以武力為後盾。\n2、以和平統一、一國兩制為包裝。"}, {"id": "e1-8", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第九題", "q": "中共對臺策略，在胡錦濤的主導之下依循其提出「新胡四點」為主軸，內容為何？", "a": "1、主動出擊。\n2、區隔對待。\n3、軟硬兼施。\n4、入島入心。"}, {"id": "e1-9", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第十題", "q": "習近平的新對臺政策，歸納起來，將以「全方位、制度化」為主軸，有哪五大方向？", "a": "1、由經入政。\n2、兩岸區域合作。\n3、文化溶臺論。\n4、建立全領域簽署網絡。\n5、建立「共一民」接觸管道。"}, {"id": "e1-10", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第十一題", "q": "中共對臺外交統戰有哪些政策？", "a": "1、堅持所謂「一中政策」。\n2、以美制臺。\n3、阻擾我參與國際組織。"}, {"id": "e1-11", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第十二題", "q": "面對中共對臺統戰，我們應有的反制作為為何？", "a": "1、認清中共對臺統戰策略。\n2、落實全民國防教育。\n3、強化敵情教育。\n4、增進國軍戰力，打造國際化優質勁旅。"}, {"id": "e1-12", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第十三題", "q": "當前中共對臺統戰戰略之分析，內容為何？", "a": "1、一個中國原則。\n2、和平統一、一國兩制。\n3、不放棄對臺使用武力。"}, {"id": "e1-13", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第十四題", "q": "面對當前中共統戰，我軍應有的反制作為，其中「認清中共對臺統戰策略」可細分為何？", "a": "1、制定國家總體「反三戰」戰略。\n2、展開全軍反三戰論壇。\n3、加強國際文宣力道凸顯「中國威脅」事實。\n4、剖析「軟的更軟、硬的更硬」策略。"}, {"id": "e1-14", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第十五題", "q": "面對當前中共統戰，我軍應有的反制作為，其中「落實全民國防教育」可細分為何？", "a": "1、深化國民「全民防衛」意識。\n2、建立「全民參與」的國防。"}, {"id": "e1-15", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第十六題", "q": "面對當前中共統戰，我軍應有的反制作為，其中「強化敵情教育」可細分為何？", "a": "1、「中共崛起」。\n2、「軍事情勢」。\n3、「潛在危機」。"}, {"id": "e1-16", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第十七題", "q": "當前中共三戰作為為何？", "a": "1、法律戰。\n2、輿論戰。\n3、心理戰。"}, {"id": "e1-17", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第十八題", "q": "面對當前中共統戰，我軍應有的反制作為，其中「增進國軍戰力，打造國際化優質勁旅」可細分為何？", "a": "1、建立「小而精、小而強、小而巧」的現代化部隊。\n2、增進軟實力，強化政戰功能。"}, {"id": "e1-18", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第十九題", "q": "中共認為，當前最有可能危及臺灣主權問題有內、外兩個因素，其中內部因素為何？", "a": "主要來自臺灣的臺獨勢力。"}, {"id": "e1-19", "exam": 1, "ch": "中共對臺統戰戰略", "n": "第二十題", "q": "中共認為，當前最有可能危及臺灣主權問題有內、外兩個因素，其中外部因素為何？", "a": "主要來自美國對臺灣問題之直接或間接的介入。"}, {"id": "e1-a1", "exam": 1, "ch": "中共對臺統戰戰略", "n": "應用題第一題", "q": "本週首先由電視教學製播兩岸專題座談會，談論中共對臺統戰策略的基本原則等相關內容，請言簡意賅地摘要其基本原則及為何？", "a": "1、聯合次要敵人，打擊主要敵人。\n2、中共對臺統戰策略的基本原則：\n（1）利用敵人內部矛盾的原則。\n（2）既聯合又鬥爭的原則。\n（3）獨立自主的原則。\n（4）爭取領導權的原則。"}, {"id": "e1-a2", "exam": 1, "ch": "中共對臺統戰戰略", "n": "應用題第二題", "q": "承上題，從節目內容可知當前中共的對臺政策，在一個中國原則下，以哪兩種（和戰）手段進行破為其策略？而面臨中共對我的統戰作為，我們應有的反制作為為何？", "a": "1、（1）以武力為後盾。\n（2）以和平統一與一國兩制為包裝。\n2、反制作為如下：\n（1）認清中共對臺統戰策略。\n（2）落實全民國防教育。\n（3）強化敵情教育。\n（4）增進國軍戰力，打造國際化優質勁旅。"}, {"id": "e1-20", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第一題", "q": "民事、服務與福利工作是實現全民國防最重要的作為之一，其目標為何？", "a": "1、對內：服務官兵，凝聚部隊向心，增強部隊戰力。\n2、對外：爭取民眾支持，建立共信共識，塑建國軍優質形象，進而達到全民國防。"}, {"id": "e1-21", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第二題", "q": "民事、服務與福利工作執行時必須確立哪些工作態度，並應秉持哪些精神？", "a": "1、確立以「誠意為先，服務為樂」的工作態度。\n2、秉持「愛心」與「耐心」的精神。"}, {"id": "e1-22", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第三題", "q": "「民事協調會報」有哪些重點工作？", "a": "1、做好官兵服務。\n2、落實福利工作。\n3、強化軍民關係。\n4、整合地區資源。"}, {"id": "e1-23", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第四題", "q": "國軍「愛民敬軍」按舉主題為何？", "a": "1、如何建立軍民良好關係。\n2、如何強化軍民糾紛協處。\n3、如何做好敦親睦鄰工作。"}, {"id": "e1-24", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第五題", "q": "敦親睦鄰工作以透過哪些方式，建立深厚情誼？", "a": "拜訪、聯誼、協調支援及災害救助等方式。"}, {"id": "e1-25", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第六題", "q": "民事、服務與福利工作之對象包括哪些？", "a": "官兵、眷（徵）屬、軍眷眷、一般社會大眾。"}, {"id": "e1-26", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第七題", "q": "基層營、連級如何建立良好軍民關係？", "a": "做好官兵照顧及眷屬服務為主，以爭取廣大軍眷向心。"}, {"id": "e1-27", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第八題", "q": "發生官兵傷亡事件，應如何處置？", "a": "應於第一時間主動慰問協處，分別協請地區留守業務處辦理傷亡撫卹，及申請國軍軍家屬扶助基金會、縣市政府辦理傷亡慰問。"}, {"id": "e1-28", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第九題", "q": "基層營、連級官兵辦理結婚，應如何處置？", "a": "主管應親自參加，如另有要務無法親自前往，除指派幹部代表參加，並盡全力協助辦理婚事。"}, {"id": "e1-29", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第十題", "q": "國軍官兵眷（徵）屬服務，其項目為何？", "a": "1、聯繫巡迴訪問。\n2、徵屬連線服務。\n3、個案協調輔導。\n4、軍人團體意外保險代收服務。"}, {"id": "e1-30", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第十一題", "q": "外島地區眷屬官兵眷屬探訪活動，其實施方式與時間為何？", "a": "1、定期方式：以國定例假日為主。\n2、臨機方式：配合婚喪喜慶及三節慰問等。"}, {"id": "e1-31", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第十二題", "q": "國軍各級協助民間各項活動時，應依據何項規定？", "a": "依據「國軍支援社會活動兵力派遣暨責任分作業規定」。"}, {"id": "e1-32", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第十三題", "q": "民事協調會報之召開權責區分為何？", "a": "綜合協調單位、責任分區單位、民事執行單位。"}, {"id": "e1-33", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第十四題", "q": "民事服務工作之執行要領為何？", "a": "1、做好官兵服務。\n2、落實福利工作。\n3、強化軍民關係。\n4、整合地區資源。"}, {"id": "e1-34", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第十五題", "q": "服務工作之原則為何？", "a": "熱忱、主動、深入、耐煩。"}, {"id": "e1-35", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第十六題", "q": "「國軍基層優秀官兵旅遊」之薦報原則為何？", "a": "以連、營級軍官5%、士官35%、士兵60%之原則薦報，並以支領地域加給及危險勤務加給之外（離）島、高山、偏遠地區官兵為優先薦報對象。"}, {"id": "e1-36", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第十七題", "q": "重要民事聯繫對象可區分為哪幾類？", "a": "1、政府機關。\n2、民代仕紳。\n3、民間團體。\n4、傳播媒體。"}, {"id": "e1-37", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第十八題", "q": "軍民關係的工作範圍包含哪些？", "a": "1、敦親睦鄰工作。\n2、支援社會活動。\n3、軍民糾紛調處。\n4、民事協調會報。\n5、策動敬軍勞軍。"}, {"id": "e1-38", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第十九題", "q": "「行動福利站」支援申請作業，救災部隊如何提出申請？", "a": "由軍團級（含比照）依需求函政治作戰局申請，福利事業管理處依令開設。"}, {"id": "e1-39", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "第二十題", "q": "「行動福利站」支援申請作業，演訓、營區開放隸及偏遠單位（地區）巡迴服務如何提出申請？", "a": "由各聯兵旅級（含比照）具函申請，於活動實施前1個月函福利事業管理處。"}, {"id": "e1-b1", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "應用題第一題", "q": "近期單位中士○○○家屬因病過世，連長指示輔導長全力協助該員處理後續事宜。請問針對單位在官兵服務工作上包含哪些項目？另基層營、連級官兵眷屬家庭狀況，遇有傷病急難情形，其具體作法為何？", "a": "1、官兵服務工作項目：\n（1）官兵緊急傷亡慰問。\n（2）各級懇親聯誼活動。\n（3）基層優秀官兵旅遊。\n（4）常備戰士家屬服務。\n2、具體作法：\n（1）主動協調奉籍所在地留守業務中心（處）及軍人服務站辦理慰助。\n（2）眷屬遭逢重大變故，除協助官兵返家協處外，並應透過各縣（市）社會局、慈善機構、辦理慰問及協助申辦紓困優惠貸款。"}, {"id": "e1-b2", "exam": 1, "ch": "民事福利服務暨軍眷服務", "n": "應用題第二題", "q": "近期因豪雨肆虐，○旅奉命前往災區進行救災工作，貴官為政綜科政戰士，奉政戰主任指示，為激勵救災官兵士氣、凝聚單位向心，故須申請「行動福利站」支援開設，請問「行動福利站」支援申請作業，救災部隊如何提出申請？另旅部於救災任務結束後，將辦理營區開放，請問「行動福利站」支援申請作業，如何提出申請？", "a": "1、由軍團級（含比照）依需求函政治作戰局申請，福利事業管理處依令開設。\n2、由各聯兵旅級（含比照）具函申請，於活動實施前1個月函福利事業管理處。"}, {"id": "e1-40", "exam": 1, "ch": "保防安全", "n": "第一題", "q": "國軍保防安全五大核心工作為何？", "a": "1、保防教育。\n2、機密維護。\n3、安全調查。\n4、情蒐工作。\n5、專案偵防。"}, {"id": "e1-41", "exam": 1, "ch": "保防安全", "n": "第二題", "q": "國軍保防教育區分哪六項？", "a": "1、新兵教育。\n2、部隊教育。\n3、學校教育。\n4、退離（職）人員教育。\n5、眷屬教育。\n6、後備軍人教育。"}, {"id": "e1-42", "exam": 1, "ch": "保防安全", "n": "第三題", "q": "「安全考核鑑定」實施對象區分哪4大類？", "a": "「機敏單位」、「正平工作」、「榮典部隊」及「啟新工作」對象等4類。"}, {"id": "e1-43", "exam": 1, "ch": "保防安全", "n": "第四題", "q": "國軍人員安全調查工作中，「正平工作」適用範圍與對象為何？", "a": "1、國軍飛行單位。\n2、國軍艦艇單位。\n3、國軍戰甲車單位。\n4、各類少人操作高性能武器。\n5、各類飛彈部隊。\n6、外島地區。"}, {"id": "e1-44", "exam": 1, "ch": "保防安全", "n": "第五題", "q": "試述正義專案提到對於嚴禁於營內與大陸地區人民及香港、澳門地區居民接觸聯繫規範如何？", "a": "1、國軍人員嚴禁於營內使用任何私人或公務用之通（資）訊設備與大陸地區人民及香港、澳門地區居民接觸聯繫。\n2、因婚姻關係與配偶聯繫，仍需遵從第一款規範之要求，並禁止私自引介、夾帶大陸地區人民及香港、澳門地區居民入營。\n3、駐外代表團（軍協組）人員，嚴禁於辦公場域使用私人或公務通（資）訊設備與大陸地區人民及香港、澳門地區居民接觸聯繫，並禁止引介、夾帶前述人員進入辦公場域。"}, {"id": "e1-45", "exam": 1, "ch": "保防安全", "n": "第六題", "q": "國軍保防工作中之「狀況掌握」目的為何？", "a": "在掌握事件發生之初的各種跡象與徵候，俾達到先知快報的要求，以期對事件的有效防制與消弭。"}, {"id": "e1-46", "exam": 1, "ch": "保防安全", "n": "第七題", "q": "狀況掌握的兩個重要觀念為何？", "a": "「先知」及「快報」。"}, {"id": "e1-47", "exam": 1, "ch": "保防安全", "n": "第八題", "q": "安全狀況掌握反映與處理要領中「重大安全狀況」及「一般安全狀況」報部處理時間為何？", "a": "重大安全狀況自單位獲悉案況起「20分鐘」內，反映本部完成初步回報，並於「30分鐘」內詳實補充續報；一般安全狀況自單位獲悉案況起「180分鐘」內將情況逐級反映至本部；若發現媒體於現場採訪，則均應立即回報。"}, {"id": "e1-48", "exam": 1, "ch": "保防安全", "n": "第九題", "q": "安全狀況掌握反映內容應簡明及要件齊全，敘述要項應包含哪些項目？", "a": "包含：「何人（單位）於何時在何地、為何原因發生何事，現況如何、單位處置、人員（家屬）反應為何」等，並附記人員基本資料。"}, {"id": "e1-49", "exam": 1, "ch": "保防安全", "n": "第十題", "q": "為有效掌握安全狀況、落實反情搜網絡，各單位應如何作為？", "a": "明確劃分「安全責任區域」，並輔以時程規劃結合安全防護措施，實施定期演練。"}, {"id": "e1-50", "exam": 1, "ch": "保防安全", "n": "第十一題", "q": "複影印機管制規定中，針對複印機密資訊有何限制？", "a": "除「絕對機密」不得複製外，餘「極機密」級（含）以下之機密資訊，經原產製單位授權或許可後，始准複（影）印；但複製物應視同原件，依其機密等級、屬性分別採適切之管制及保護措施。"}, {"id": "e1-51", "exam": 1, "ch": "保防安全", "n": "第十二題", "q": "保密督導官運用設置由誰擔任？", "a": "由各級單位副主官（管），負責單位保密工作之監督、執行與協調。"}, {"id": "e1-52", "exam": 1, "ch": "保防安全", "n": "第十三題", "q": "簡述保密工作之基本手段？", "a": "限制、禁止、防護、滅跡。"}, {"id": "e1-53", "exam": 1, "ch": "保防安全", "n": "第十四題", "q": "「機密等級」區分為哪幾種？", "a": "「絕對機密」、「極機密」、「機密」、「密」等4種。"}, {"id": "e1-54", "exam": 1, "ch": "保防安全", "n": "第十五題", "q": "「機密屬性」區分為哪幾種？", "a": "「國家機密」、「軍事機密」、「國防秘密」、「國家機密亦屬軍事機密」、「國家機密亦屬國防秘密」及「一般公務機密」。"}, {"id": "e1-55", "exam": 1, "ch": "保防安全", "n": "第十六題", "q": "基層單位保防工作應深切體認做好保防教育的重要性其目標為何？", "a": "人人保密，人人防諜。"}, {"id": "e1-56", "exam": 1, "ch": "保防安全", "n": "第十七題", "q": "基層單位保防工作教育對象？", "a": "國軍現職人員（含各級官士兵、文職、聘僱人員及所屬軍事院校教職員與學員生）、眷屬及後備軍人。"}, {"id": "e1-57", "exam": 1, "ch": "保防安全", "n": "第十八題", "q": "國軍保防教育之實施方式區分幾大類？", "a": "基本教育與輔助教育。"}, {"id": "e1-58", "exam": 1, "ch": "保防安全", "n": "第十九題", "q": "保防教育針對敵人慣常對我施展之陰謀手段，以何為重點教育主軸？", "a": "反滲透、反情搜、反破壞、反顛覆。"}, {"id": "e1-59", "exam": 1, "ch": "保防安全", "n": "第二十題", "q": "保防教育軍事教育之一環，在國軍安全工作上，擔負著何種任務？", "a": "防患於未然、弭禍於無形。"}, {"id": "e1-c1", "exam": 1, "ch": "保防安全", "n": "應用題第一題", "q": "空軍○聯隊○中隊戰情通報：近期共諜案件頻繁，手段日趨多元，且各家媒體爭相報導於○年○月○日，破獲陸生共諜案乙情，因而通令要求所屬各單位落實人員清查，確實遵守相關保密規定要求；另某日晚間你發現單位一兵王小凡，在營內中山室以手機使用wechat（微信）軟體與居住在香港的妻子聯繫，妻子表示想看看丈夫的工作環境，詢問是否可辦理眷客入營。\n問題：\n1、上述王員可能違反了何項「專案規定」？\n2、該專案規定提到對於嚴禁於營內與大陸地區人民及香港、澳門地區居民接觸聯繫規範，前兩項內容為何？", "a": "1、正義專案。\n2、（1）國軍人員嚴禁於營內使用任何私人或公務用之通（資）訊設備與大陸地區人民及香港、澳門地區居民接觸聯繫。\n（2）因婚姻關係與配偶聯繫，仍需遵從第一款規範之要求，並禁止私自引介、夾帶大陸地區人民及香港、澳門地區居民入營。"}, {"id": "e1-c2", "exam": 1, "ch": "保防安全", "n": "應用題第二題", "q": "近期連上余三業務負責人下士王正生多次離開連隊辦公室時，相關作戰訓練資料未依規定存管於保密櫃中，且內容包括單位駐地訓練期程文件。貴官為該連輔導長，為導正單位作業紀律（做法），應於全連集合時轉再宣導國軍保密規定及機密資訊之存管作為。若日後看到下士王正生執行安全士官勤務交接時，將通信情況表攜至營隊辦公室實施複印，複印完後即轉交給下班安全士官，一份個人留存。\n問題：\n1、「機密等級」區分為哪4種？\n2、王員此舉已違反複影印機使用規定，請說明規定中，針對複印機密資訊有何限制？", "a": "1、「絕對機密」、「極機密」、「機密」、「密」等4種。\n2、除「絕對機密」不得複製外，餘「極機密」級（含）以下之機密資訊，經原產製單位授權或許可後，始准複（影）印；但複製物應視同原件，依其機密等級、屬性分別採適切之管制及保護措施。"}, {"id": "e1-60", "exam": 1, "ch": "軍事新聞", "n": "第一題", "q": "青年日報社發行之軍中報刊「一報」為何？", "a": "一報：青年日報。"}, {"id": "e1-61", "exam": 1, "ch": "軍事新聞", "n": "第二題", "q": "青年日報社發行之軍中報刊「兩刊」為何？", "a": "兩刊：吾愛吾家、奮鬥月刊。"}, {"id": "e1-62", "exam": 1, "ch": "軍事新聞", "n": "第三題", "q": "國軍軍種報陸軍刊物為何？", "a": "陸軍忠誠報。"}, {"id": "e1-63", "exam": 1, "ch": "軍事新聞", "n": "第四題", "q": "國軍軍種報海軍刊物為何？", "a": "海軍忠義報。"}, {"id": "e1-64", "exam": 1, "ch": "軍事新聞", "n": "第五題", "q": "國軍軍種報空軍刊物為何？", "a": "空軍忠勇報。"}, {"id": "e1-65", "exam": 1, "ch": "軍事新聞", "n": "第六題", "q": "國軍軍種報憲兵刊物為何？", "a": "憲兵忠貞報。"}, {"id": "e1-66", "exam": 1, "ch": "軍事新聞", "n": "第七題", "q": "國軍軍種報後備指揮部刊物為何？", "a": "後備忠愛報。"}, {"id": "e1-67", "exam": 1, "ch": "軍事新聞", "n": "第八題", "q": "國軍軍種報資通電軍刊物為何？", "a": "資通電軍忠信報。"}, {"id": "e1-68", "exam": 1, "ch": "軍事新聞", "n": "第九題", "q": "青年日報社的使命為何？", "a": "為貫徹執行國軍文宣政策，負責國防文宣工作，達成確保國家安全的使命。"}, {"id": "e1-69", "exam": 1, "ch": "軍事新聞", "n": "第十題", "q": "青年日報社的主要任務為何？", "a": "1、建立官兵正確認知。\n2、維護國家利益。\n3、善盡社會責任。\n4、提供大眾與官兵所需資訊。\n5、提高戰鬥意志。\n6、培養無形戰力。"}, {"id": "e1-70", "exam": 1, "ch": "軍事新聞", "n": "第十一題", "q": "民間報刊投稿之指導原則及作用為何？", "a": "應掌握時效撰文，以積極、主動及提升能見度為指導原則，以求發揮引導輿論的作用。"}, {"id": "e1-71", "exam": 1, "ch": "軍事新聞", "n": "第十二題", "q": "投稿議題依新聞、輿論屬性或政策宣導等內容區分哪三類？", "a": "第一類為政府政策；第二類為國防事務；第三類為兩岸關係。"}, {"id": "e1-72", "exam": 1, "ch": "軍事新聞", "n": "第十三題", "q": "政府政策投稿議題包含哪些？", "a": "凡涉及外交、政治、經濟、心理、社會等重大新聞事件或議題者均屬之。"}, {"id": "e1-73", "exam": 1, "ch": "軍事新聞", "n": "第十四題", "q": "國防事務投稿議題包含哪些？", "a": "凡涉及國軍軍事、戰（演）訓任務、國際軍事或各項國防重要政策等相關事項者均屬之。"}, {"id": "e1-74", "exam": 1, "ch": "軍事新聞", "n": "第十五題", "q": "兩岸關係投稿議題包含哪些？", "a": "凡中共對我統戰、威脅及製訂定涉臺之重大政策、法令等相關新聞均屬之。"}, {"id": "e1-75", "exam": 1, "ch": "軍事新聞", "n": "第十六題", "q": "青年日報社發行之「軍事春秋」現為多久發行一次的刊物？", "a": "雙月刊。"}, {"id": "e1-76", "exam": 1, "ch": "軍事新聞", "n": "第十七題", "q": "國防部發言人臉書為增開與軍民溝通、說明管道其原則為何？", "a": "軟性訴求、多元素材、即時發布。"}, {"id": "e1-77", "exam": 1, "ch": "軍事新聞", "n": "第十八題", "q": "青年日報新聞稿寫作要領其重點為何？", "a": "1、必須帶出文章的主旨。\n2、通順不拗口。\n3、不說教。\n4、對人、事、物感動後的顯露。\n5、感同身受。"}, {"id": "e1-78", "exam": 1, "ch": "軍事新聞", "n": "第十九題", "q": "青年日報新聞稿寫作要領其要領為何？", "a": "1、如何篩選新聞寫作題材。\n2、如何凸顯新聞寫作重點。\n3、如何強化新聞寫作可讀性。"}, {"id": "e1-79", "exam": 1, "ch": "軍事新聞", "n": "第二十題", "q": "青年日報新聞稿寫作常見錯誤種類為何？", "a": "新聞報導、專訪、特稿、側寫、花絮。"}, {"id": "e1-d1", "exam": 1, "ch": "軍事新聞", "n": "應用題第一題", "q": "青年日報社為負責國防文宣工作的政戰專業單位，請試述青年日報社的使命與主要任務為何？", "a": "青年日報社的使命為貫徹執行國軍文宣政策，負責國防文宣工作，達成確保國家安全的使命。主要任務在建立官兵正確認知、維護國家利益、善盡社會責任、提供大眾與官兵所需資訊、提高戰鬥意志及培養無形戰力。"}, {"id": "e1-d2", "exam": 1, "ch": "軍事新聞", "n": "應用題第二題", "q": "小青在研讀軍事新聞相關準則時讀到投稿議題依新聞、輿論屬性或政策宣導等內容區分為3類，但不清楚具體內容，請協助小青瞭解政府政策、國防事務及兩岸關係等3類投稿議題分別包含哪些。", "a": "政府政策：凡涉及外交、政治、經濟、心理、社會等重大新聞事件或議題者均屬之。\n國防事務：凡涉及國軍軍事、戰（演）訓任務、國際軍事或各項國防重要政策等相關事項者均屬之。\n兩岸關係：凡中共對我統戰、威脅及製訂定涉臺之重大政策、法令等相關新聞均屬之。"}];

  while(i<n&&j<m){if(a[i]===b[j]){ops.push(['=',a[i]]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){ops.push(['-',a[i]]);i++}else{ops.push(['+',b[j]]);j++}}
  while(i<n)ops.push(['-',a[i++]]);while(j<m)ops.push(['+',b[j++]]);
  return{len:dp[0][0],ops};
}

    for(const ch of line){buf+=ch;if('，、。；：'.includes(ch)){parts.push(buf);buf=''}}
    if(buf)parts.push(buf);
    const merged=[];parts.forEach(p=>{if(merged.length&&/^(\d+、|（[一二三四五六七八九十]）|答：)$/.test(merged[merged.length-1]))merged[merged.length-1]+=p;else merged.push(p)});
    merged.forEach((p,k)=>out.push({t:p,nl:li>0&&k===0}));
  });
  let res=out;
  if(res.length<4){const r2=[];res.forEach(o=>{if(o.t.length>4){const n=Math.ceil(o.t.length/4);const sz=Math.ceil(o.t.length/n);for(let k=0;k<o.t.length;k+=sz)r2.push({t:o.t.slice(k,k+sz),nl:o.nl&&k===0})}else r2.push(o)});res=r2}
  while(res.length>14){const r2=[];for(let k=0;k<res.length;k+=2){if(res[k+1]&&!res[k+1].nl)r2.push({t:res[k].t+res[k+1].t,nl:res[k].nl});else{r2.push(res[k]);if(res[k+1])r2.push(res[k+1])}}if(r2.length===res.length)break;res=r2}
  return res;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}


/* ---------- true/false & multiple choice ---------- */
function others(d){const seen=new Set([d.a]);const sib=new Set();(simOf[d.id]||[]).forEach(gi=>SIM[gi].ids.forEach(i=>sib.add(i)));return DATA.filter(x=>{if(!(x.ch===d.ch||sib.has(x.id))||seen.has(x.a))return false;seen.add(x.a);return true})}
function sibs(d){const s=new Set();(simOf[d.id]||[]).forEach(gi=>SIM[gi].ids.forEach(i=>{if(i!==d.id&&byId[i].a!==d.a)s.add(i)}));return [...s].map(i=>byId[i])}
function nItems(a){return items(a).length}
function makeMC(d){
  const n=nItems(d.a);
  const sb=shuffle(sibs(d));const pool=sb.concat(shuffle(others(d)).filter(x=>!sb.includes(x)).sort((x,y)=>Math.abs(nItems(x.a)-n)-Math.abs(nItems(y.a)-n)));
  const opts=[{t:d.a,ok:true}];
  const mut=mutate(d);if(mut&&Math.random()<.6)opts.push({t:mut,ok:false});
  for(const x of pool){if(opts.length>=4)break;opts.push({t:x.a,ok:false})}
  return shuffle(opts);
}
function mutate(d){
  const lines=d.a.split('\n');if(lines.length<2)return null;
  const mk=s=>(s.match(/^(\d+、|（[一二三四五六七八九十]）)/)||[''])[0];
  const donors=[];others(d).forEach(x=>x.a.split('\n').forEach(l=>{const c=l.slice(mk(l).length);if(c&&!d.a.includes(c))donors.push(c)}));
  if(!donors.length)return null;
  const k=Math.floor(Math.random()*lines.length);
  lines[k]=mk(lines[k])+donors[Math.floor(Math.random()*donors.length)];
  return lines.join('\n');
}
function makeTF(d){
  if(Math.random()<.5)return{t:d.a,ok:true};
  const mut=mutate(d);
  if(mut&&Math.random()<.6)return{t:mut,ok:false,why:'有一點被換掉了'};
  const sb=sibs(d);const o=sb.length&&Math.random()<.7?shuffle(sb)[0]:shuffle(others(d))[0];
  return o?{t:o.a,ok:false,why:'這是別題的答案：「'+o.q+'」'}:{t:d.a,ok:true};
}
function pickTF(v){const c=sess.cur;if(c.picked!=null)return;c.picked=v;const right=(v===c.tf.ok);award(right?3:1);grade(right?2:0);render()}
function pickMC(k){const c=sess.cur;if(c.picked!=null)return;c.picked=k;const right=c.opts[k].ok;award(right?5:1);grade(right?2:0);render()}

let tab='home',sess=null,bankChap=0,bankQ='',bankOpen={};
function buildDaily(){
  const t=dnum(today()),r=dayRec();
  const p=pool();
  const due=p.filter(d=>{const c=card(d.id);return c&&c.d<=t}).sort((a,b)=>card(a.id).d-card(b.id).d||card(a.id).b-card(b.id).b);
  const newLeft=Math.max(0,S.settings.newPerDay-r.newc);
  const nw=p.filter(d=>!card(d.id)).slice(0,newLeft);
  return due.concat(nw).slice(0,S.settings.size).map(d=>d.id);
}
function dueCount(){const t=dnum(today());return pool().filter(d=>{const c=card(d.id);return c&&c.d<=t}).length}
function startSession(ids,mode,title){
  if(!ids.length){toastModal('今天沒有要複習的題目了 🎉','可以到「練習」選章節自由練習，或在設定提高每日新題數。');return}
  sess={q:ids.slice(),total:ids.length,done:0,mode,title,cur:null,again:{},xp:0,right:0};
  tab='session';nextCard();
}
function autoMode(id){const c=card(id);const b=c?c.b:0;return b===0?'tf':(b===1?'mc':(b<=3?'order':'write'))}
function nextCard(){
  if(!sess.q.length){finishSession();return}
  const id=sess.q.shift();const m=sess.mode==='auto'?autoMode(id):sess.mode;
  sess.cur={id,m,picked:null,revealed:false,hint:false,placed:[],used:[],tiles:null,mist:0,result:null,input:''};
  if(m==='order'){const ch=chunks(byId[id].a);sess.cur.target=ch;sess.cur.tiles=shuffle(ch.map((c,i)=>({...c,i})))}
  if(m==='tf')sess.cur.tf=makeTF(byId[id]);
  if(m==='mc')sess.cur.opts=makeMC(byId[id]);
  render();
}
function grade(q){ // q: 0 fail,1 meh,2 good
  const id=sess.cur.id,r=dayRec(),t=dnum(today());
  let c=card(id);if(!c){c=S.cards[id]={b:0,d:t,n:0,ok:0};r.newc++}
  c.n++;r.rev++;
  if(q===2){c.b=Math.min(6,c.b+1);c.ok++;sess.right++}
  else if(q===1){c.b=Math.max(1,c.b)}
  else{c.b=Math.max(0,c.b-2)}
  c.d=t+(q===0?0:(q===1?1:INTV[c.b]));
  if(q===0&&!sess.again[id]){sess.again[id]=1;sess.q.push(id)}
  sess.done++;save();
}
function finishSession(){
  const s=sess;tab='home';sess=null;render();
  showModal(`<div style="font-size:46px">🍖</div><h2>練習完成！</h2><p>答對 ${s.right} 題・獲得 <b>${s.xp} XP</b></p><p class="sub">今日進度 ${dayRec().xp} / ${S.settings.goal} XP</p><button class="btn pri" onclick="closeModal()">回去看小怪獸</button>`);
}

let roomNS=null,roomTried=false;

function seeded(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function hostPeer(){if(!B.r)return null;const hs=B.r.peers().filter(p=>p.presence&&p.presence.host);hs.sort((a,b)=>(a.presence.since||0)-(b.presence.since||0));return hs[0]||null}

  if(B.phase==='lobby'){const h=hostPeer();const iAmHost=B.host;
    app.innerHTML=`<div class="top"><button class="x" onclick="leaveRoom()">✕</button><h2 style="margin:0">對戰房</h2></div>
    <div class="card"><div class="sub small" style="text-align:center">房間代碼（告訴同梯）</div><div class="code">${B.code}</div>
    <div class="sub small" style="text-align:center;line-height:1.6">朋友打開同一個網站 → ⚔️ 對戰 → 輸入代碼加入</div></div>
    <div class="card"><h2>玩家</h2><div id="board">${boardHTML()}</div></div>
    ${iAmHost?`<div class="card"><label class="set">題目範圍<select onchange="B.chap=+this.value">${chOpts}</select></label><label class="set">題數<select onchange="B.count=+this.value">${[5,10,15,20].map(n=>`<option ${n===B.count?'selected':''}>${n}</option>`).join('')}</select></label>
      <button class="btn pri" style="margin-top:8px" onclick="hostStart()">🚀 開始對戰</button></div>`:`<div class="card sub" style="text-align:center">等待房主開始…${h?'':'（房主還沒連上）'}</div>`}`;return}
  if(B.phase==='count'){app.innerHTML=`<div class="card" style="text-align:center"><div class="sub">${esc(B.title||'')}・${B.ids.length} 題</div><div class="big">${B.cd}</div><div class="sub">準備搶答！</div></div><div class="card"><div id="board">${boardHTML()}</div></div>`;return}
  if(B.phase==='play'){const d=byId[B.ids[B.idx]];const done=B.picked!=null;
    app.innerHTML=`<div class="top"><button class="x" onclick="leaveRoom()">✕</button><div class="bar g"><i style="width:${B.idx/B.ids.length*100}%"></i></div><span class="sub small">${B.idx+1}/${B.ids.length}</span></div>
    <div class="card"><div class="row" style="justify-content:space-between"><span class="modebadge">⚔️ 搶答</span><span class="tag">${esc(d.ch)}｜${d.n}</span></div><div class="q">${esc(d.q)}</div>
    ${B.opts.map((o,k)=>`<button class="ans" style="display:block;width:100%;text-align:left;font-size:15px;border:2px solid ${done?(o.ok?'var(--g)':(k===B.picked?'var(--r)':'transparent')):'transparent'};${done&&o.ok?'background:var(--g2)':''}${done&&!o.ok&&k===B.picked?'background:var(--r2)':''}" onclick="pickB(${k})"><b>${'ABCD'[k]}.</b> ${esc(o.t)}</button>`).join('')}
    ${done?`<div class="score">${B.opts[B.picked].ok?'🎯 +'+B.lastPts:'❌ 0'}</div>`:''}</div>
    <div class="card"><div class="sub small">即時排名（你 ${B.score} 分）</div><div id="board">${boardHTML()}</div></div>`;return}
  if(B.phase==='result'){app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:46px">🏁</div><h2>你完成了！答對 ${B.right}/${B.ids.length}・${B.score} 分</h2><div id="resmsg" class="sub">等待其他人作答完成…</div></div>
    <div class="card"><h2>排名</h2><div id="board">${boardHTML()}</div></div>
    ${B.host?`<button class="btn pri" style="margin-bottom:10px" onclick="B.phase='lobby';rBattle()">🔁 再來一局</button>`:`<div class="card sub" style="text-align:center">等房主開下一局，會自動開始</div>`}
    <button class="btn ghost" onclick="leaveRoom()">離開房間</button>`;updateBoard();return}
}

/* ---------- modal ---------- */
function showModal(h){document.getElementById('modalBody').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}
function toastModal(t,s){showModal(`<h2>${t}</h2>${s?`<p class="sub">${s}</p>`:''}<button class="btn pri" onclick="closeModal()">好</button>`)}
function levelUp(p){
  confetti();
  showModal(p.evo?`<div class="pet happy">${monsterSVG(p.L,'happy')}</div><h2>✨ 進化了！</h2><p><b>${esc(S.name)}</b> 變成了 <b>${p.evo.name}</b>！</p><button class="btn pri" onclick="closeModal();render()">太棒了！</button>`
   :`<div style="font-size:50px">⬆️</div><h2>升級！Lv.${p.L}</h2><p>${esc(S.name)} 變得更強了！</p><button class="btn pri" onclick="closeModal()">繼續加油</button>`);
}
function confetti(){const cs=['#e9b93a','#4f7d4a','#e8833a','#3f6b8f','#c9483b'];for(let i=0;i<40;i++){const e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=cs[i%5];e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}}

document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;render();window.scrollTo(0,0)});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
applyEdits();
render();
</script>
</body>
</html>
